[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "psl-translator"
version = "1.0.0"
authors = [{ name = "Abdul Rehman" }]
description = "PSL — Pakistani Sign Language Translator: sign recognition with MediaPipe + a Temporal Convolutional Network, with LLM sentence generation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24,<2.0",
    "opencv-python>=4.8",
    "mediapipe==0.10.14",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "tqdm",
    "flask>=3.0",
    "flask-cors>=4.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
