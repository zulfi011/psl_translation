[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "psl-research"
version = "0.1.0"
description = "Research code for Pakistani Sign Language recognition: landmark extraction, preprocessing, models and signer-independent evaluation."
authors = [{ name = "Abdul Rehman" }]
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24,<2.0",
    "opencv-python>=4.8",
    "mediapipe==0.10.14",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
